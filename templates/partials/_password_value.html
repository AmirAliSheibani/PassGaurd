{# The value is included in the response by the current DetailView. This UI masks it visually; it does not replace server-side authorization. #}
<div class="password-display">
  <label class="visually-hidden" for="{{ input_id }}">{{ label|default:"Password" }}</label>
  <input class="password-display-input detail-value--password" id="{{ input_id }}" type="password" value="{{ value }}" readonly autocomplete="off" spellcheck="false" aria-label="{{ label|default:'Password' }}">
  <div class="password-display-actions">
    <button class="icon-button icon-button--small" type="button" data-password-toggle="{{ input_id }}" aria-label="Show {{ label|default:'password' }}" aria-pressed="false">{% include "partials/_icon.html" with name="eye" %}</button>
    <button class="icon-button icon-button--small" type="button" data-copy-target="{{ input_id }}" aria-label="Copy {{ label|default:'password' }}" data-copy-success="Password copied to clipboard.">{% include "partials/_icon.html" with name="copy" %}</button>
  </div>
</div>
