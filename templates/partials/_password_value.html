<div class="password-display" data-password-display>
  <label class="visually-hidden" for="{{ input_id }}">{{ label|default:"Password" }}</label>
  <div class="password-display-control">
    <input
      class="password-display-input detail-value--password"
      id="{{ input_id }}"
      type="password"
      value=""
      readonly
      autocomplete="off"
      spellcheck="false"
      aria-label="{{ label|default:'Password' }}"
      data-password-output
    >
    <div class="password-display-actions">
      <button
      class="icon-button icon-button--small"
      type="button"
      data-password-reveal
      aria-controls="{{ input_id }}"
      aria-label="Load password"
      title="Load password"
      >{% include "partials/_icon.html" with name="eye" %}</button>
      <button
      class="icon-button icon-button--small"
      type="button"
      data-password-toggle="{{ input_id }}"
      aria-label="Show {{ label|default:'password' }}"
      aria-pressed="false"
      hidden
      >{% include "partials/_icon.html" with name="eye" %}</button>
      <button
      class="icon-button icon-button--small"
      type="button"
      data-copy-target="{{ input_id }}"
      aria-label="Copy {{ label|default:'password' }}"
      data-copy-success="Password copied to clipboard."
      disabled
      >{% include "partials/_icon.html" with name="copy" %}</button>
    </div>
  </div>
  <form class="visually-hidden" method="post" action="{{ reveal_url }}" data-password-reveal-form>
    {% csrf_token %}
  </form>
  <p class="field-help" data-password-reveal-status aria-live="polite">Password is not loaded into this page until you request it.</p>
</div>
